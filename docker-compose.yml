   services:
     db:
       image: postgres:16
       environment:
         POSTGRES_USER: brightloop
         POSTGRES_PASSWORD: brightloop
         POSTGRES_DB: brightloop
       ports: ["5432:5432"]
       volumes: [pgdata:/var/lib/postgresql/data]
     mailpit:
       image: axllent/mailpit
       ports: ["1025:1025", "8025:8025"]
   volumes:
     pgdata: